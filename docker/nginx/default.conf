server {
    listen 80;
    server_name _;

    root /var/www/html/public;
    index index.php;

    client_max_body_size 50M;

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    # Livewire serves /livewire/livewire.js dynamically through Laravel.
    # Ensure these requests reach index.php instead of being treated as static assets.
    location ^~ /livewire/ {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location ~ \.php$ {
        try_files $uri =404;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        fastcgi_param PATH_INFO $fastcgi_path_info;
        fastcgi_index index.php;
        fastcgi_pass app:9000;
    }

    location ~* \.(css|js|jpg|jpeg|png|gif|svg|ico|webp|ttf|otf|woff|woff2)$ {
        expires 7d;
        access_log off;
        try_files $uri =404;
    }
}
